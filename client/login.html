<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In &amp; Register — Community Care Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #0a3d24;
      --green-main: #16995a;
      --green-light: #e3f5ea;
      --green-tint: #f2faf5;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #101828;
      --muted: #667085;
      --line: #eaecf0;
      --font-display: "Manrope", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.08);
      border: 1px solid var(--line);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--green-dark);
    }

    .brand-header h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      margin-top: 12px;
    }

    .brand-header p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .tab-toggle-row {
      display: flex;
      background: #f2f4f7;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 9px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--green-dark);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .role-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-card {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .role-card.active {
      border-color: var(--green-main);
      background: var(--green-tint);
    }

    .role-card h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    .role-card.active h4 {
      color: var(--green-dark);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #344054;
      margin-bottom: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .input-field:focus {
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(22, 153, 90, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: var(--green-dark);
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 0.96rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--green-main);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="brand-header">
    <div class="brand-badge">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor"/>
        <path d="M16 22.5c-4.4-2.7-7.5-5.6-7.5-9.3a5 5 0 0 1 7.5-4.3 5 5 0 0 1 7.5 4.3c0 3.7-3.1 6.6-7.5 9.3Z" fill="#fff"/>
      </svg>
      Community Care
    </div>
    <h1 id="pageTitle">Create your account</h1>
    <p id="pageSubtitle">Join thousands making a difference today</p>
  </div>

  <div class="tab-toggle-row">
    <button class="tab-btn active" id="tabSignup" onclick="setAuthMode('signup')">Register</button>
    <button class="tab-btn" id="tabSignin" onclick="setAuthMode('signin')">Sign In</button>
  </div>

  <form id="standaloneAuthForm">
    <!-- Role Selector -->
    <span class="role-label" id="roleLabel">SELECT YOUR ROLE</span>
    <div class="role-grid" id="roleGrid">
      <div class="role-card active" data-role="volunteer" onclick="selectRole('volunteer', this)">
        <h4>Volunteer</h4>
      </div>
      <div class="role-card" data-role="donor" onclick="selectRole('donor', this)">
        <h4>Donor</h4>
      </div>
      <div class="role-card" data-role="admin" onclick="selectRole('admin', this)">
        <h4>Admin</h4>
      </div>
    </div>

    <!-- Name inputs for Register mode -->
    <div class="form-row signup-field">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" class="input-field" placeholder="Priya" required />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" class="input-field" placeholder="Sharma" required />
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" class="input-field" placeholder="priya@carefirst.org" required />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="passInput">Password</label>
      <input type="password" id="passInput" class="input-field" placeholder="••••••••••••" required />
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
  </form>
</div>

<script>
  let currentMode = 'signup';
  let selectedRole = 'volunteer';

  function setAuthMode(mode) {
    currentMode = mode;
    document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('tabSignin').classList.toggle('active', mode === 'signin');

    const signupFields = document.querySelectorAll('.signup-field');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const submitBtn = document.getElementById('submitBtn');

    if (mode === 'signin') {
      pageTitle.textContent = 'Welcome Back';
      pageSubtitle.textContent = 'Sign in to access your dashboard';
      submitBtn.textContent = 'Sign In to Portal';
      signupFields.forEach(el => el.style.display = 'none');
    } else {
      pageTitle.textContent = 'Create your account';
      pageSubtitle.textContent = 'Join thousands making a difference today';
      submitBtn.textContent = 'Create Account';
      signupFields.forEach(el => el.style.display = '');
    }
  }

  function selectRole(role, card) {
    selectedRole = role;
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  }

  document.getElementById('standaloneAuthForm').addEventListener('submit', (e) => {
    e.preventDefault();

    let userName = '';
    if (currentMode === 'signup') {
      const first = (document.getElementById('firstName').value || '').trim();
      const last = (document.getElementById('lastName').value || '').trim();
      userName = `${first} ${last}`.trim() || 'User';
    } else {
      const email = (document.getElementById('emailInput').value || '').trim();
      userName = email ? email.split('@')[0] : 'User';
    }

    const userData = {
      name: userName,
      email: (document.getElementById('emailInput').value || '').trim(),
      role: selectedRole
    };

    try {
      localStorage.setItem('currentUser', JSON.stringify(userData));
    } catch (err) {}

    // Navigate to role dashboard with custom name
    if (selectedRole === 'donor') {
      window.location.href = `donor-dashboard.html?name=${encodeURIComponent(userName)}&role=Donor`;
    } else if (selectedRole === 'admin') {
      window.location.href = `admin-dashboard.html?name=${encodeURIComponent(userName)}&role=Admin`;
    } else {
      window.location.href = `volunteer-dashboard.html?name=${encodeURIComponent(userName)}&role=Volunteer`;
    }
  });
</script>
</body>
</html>
